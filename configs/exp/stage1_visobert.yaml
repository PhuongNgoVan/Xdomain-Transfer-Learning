# Cấu hình Stage 1 (CV-P8): Fine-tune ViSoBERT 7 cảm xúc trên UIT-VSMEC sạch
backbone: uitnlp/visobert
model_alias: ViSoBERT
mode: stage1
variant: base
input_column: text
num_labels: 7
max_length: 256
dynamic_padding: true
group_by_length: true
dropout: 0.1

loss: ce
batch_size: 16
gradient_accumulation_steps: 2
grad_accum: 2
learning_rate: 2.0e-5
lr: 2.0e-5
num_train_epochs: 10
epochs: 10
warmup_ratio: 0.06
lr_scheduler_type: linear
weight_decay: 0.01
precision: fp16
seed: 0

eval_strategy: steps
save_strategy: steps
save_total_limit: 2
metric_for_best_model: macro_f1
greater_is_better: true
early_stopping_patience: 5
load_best_model_at_end: true

keep_ckpt: true
official: false
